name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use project npm version
        run: npm install --global npm@11.19.1 --no-audit --no-fund

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Audit dependencies
        run: npm run audit:all

  validation:
    name: Tests and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use project npm version
        run: npm install --global npm@11.19.1 --no-audit --no-fund

      - name: Verify runtime versions
        run: |
          node --version
          node -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1)"
          test "$(npm --version)" = "11.19.1"

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Run unit and API tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Install Chromium for browser smoke
        run: npx playwright install --with-deps --only-shell chromium

      - name: Run browser smoke
        run: npm run test:e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-artifacts
          path: |
            output/playwright/test-results/
            output/playwright/report/
          if-no-files-found: ignore
          retention-days: 7

  quality:
    name: Quality gate
    needs: [audit, validation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require audit and validation to succeed
        env:
          AUDIT_RESULT: ${{ needs.audit.result }}
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: |
          test "$AUDIT_RESULT" = success
          test "$VALIDATION_RESULT" = success
